[build-system]
requires = ["setuptools>=68.0", "wheel", "pybind11>=2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my_data_science_project"
version = "0.1.0"
description = "A personal project to advance my career in data science as a whole"
dependencies = ["pytest>=8.0.0",]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Ignore specific rules:
# E701: multiple statements on one line (used in match-case blocks)
# E712: comparing booleans using == or != (used in conditions playground)
# F401: unused imports (like 'import math' when experimenting)
ignore = ["E701", "E712", "F401"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.pytest.ini_options]
# A coursework translation keeps its own self-contained pytest suite beside the
# code it tests, so the main suite has to list it explicitly - otherwise the
# suite runs only from inside that folder and a bare `pytest` silently skips it.
# Weekly lecture and practical folders are deliberately absent: they are
# practice material, not assessed code, and adding them would collect several
# hundred import-only checks.
testpaths = [
    "tests",
    "university_courseworks/year1/semester2/cs1op/coursework/python/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers"
pythonpath = ["python", "requirements"]

[tool.coverage.run]
# Scope the default report to the python/ portfolio tree (every .py file is
# listed, even at 100%, because skip_covered is disabled below). The assessed
# coursework under university_courseworks/ is measured separately, on demand,
# with --cov=university_courseworks, so its untested files are kept out of the
# portfolio total instead of pulled into it.
source = ["python"]
# [AI] branch = true: line coverage alone reported 99% while 99 branch
# directions had never run - six files sat at 100% lines with a fifth of their
# branches unexercised. Branch figures are now part of the standard report.
branch = true
omit = [
    "*/__pycache__/*",
    "*/pytest-of-*/*",
    "*/AppData/Local/Temp/*",
    "tests/*",
    # Untracked practice material, not repository content. Coverage walks the
    # filesystem rather than git, so without this the report counts a file the
    # repo does not contain and every measured denominator shifts by one -
    # main.py was omitted here for a while and is measured again, but aim.py
    # stays out because the owner keeps it deliberately outside version control.
    "python/sandbox/aim.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false


